configuration:
  api_port:
    name: API Port
    description: >-
      Port for the OpenAI-compatible /v1 endpoint. Other services like Hermes
      or OpenClaw connect to this port.
  log_level:
    name: Log Level
    description: >-
      Server log verbosity. Use "debug" when troubleshooting.
  encryption_key:
    name: Encryption Key
    description: >-
      AES-256 key used to encrypt your provider API keys at rest. Leave empty
      to auto-generate and persist one. Only set this if you are migrating
      from an existing FreeLLMApi instance and need to reuse its key.
  database_type:
    name: Database Type
    description: >-
      Choose SQLite (default) or MySQL/MariaDB. Note: the server currently
      uses SQLite; MySQL/MariaDB config is saved for future compatibility.
  database_host:
    name: Database Host
    description: >-
      Hostname of the MySQL/MariaDB server. The default "core-mariadb" points
      to the official Home Assistant MariaDB add-on.
  database_port:
    name: Database Port
    description: Port of the MySQL/MariaDB server (default 3306).
  database_name:
    name: Database Name
    description: Name of the database to use.
  database_user:
    name: Database User
    description: Username for the database connection.
  database_password:
    name: Database Password
    description: Password for the database connection.
