name: FreeLLMApi for HA
version: "1.0.10"
slug: freellmapi
description: >-
  Port of FreeLLMApi for Home Assistant. Aggregates 34+ free LLM providers
  behind one OpenAI-compatible /v1 endpoint with smart routing, automatic
  failover, encrypted key storage, and a built-in dashboard.
url: "https://github.com/Sentinel-Mexico/freellmapi-ha-add-on"
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: false
host_network: false

ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: "mdi:robot-outline"
panel_title: FreeLLMApi

ports:
  39101/tcp: 39101
ports_description:
  39101/tcp: "OpenAI-compatible API (/v1) — use this from Hermes, OpenClaw, or other clients"

map:
  - app_config:rw

options:
  api_port: 39101
  log_level: "info"
  encryption_key: ""
  database_type: "sqlite"
  database_host: "core-mariadb"
  database_port: 3306
  database_name: "freellmapi"
  database_user: "freellmapi"
  database_password: ""

schema:
  api_port: port
  log_level: "list(debug|info|warn|error)"
  encryption_key: "str?"
  database_type: "list(sqlite|mysql|mariadb)"
  database_host: "str?"
  database_port: "port?"
  database_name: "str?"
  database_user: "str?"
  database_password: "password?"

startup: application
stage: experimental
advanced: false
