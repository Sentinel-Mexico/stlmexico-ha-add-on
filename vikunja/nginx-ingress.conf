server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Serve the ingress-fix script as a static file.
    location = /ha-ingress-fix.js {
        alias /etc/nginx/ha-ingress-fix.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    # API and WebSocket — proxy without any body rewriting.
    location /api/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /dav/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/dav/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Static assets — proxy directly, no rewriting needed.
    # These are fetched by the browser using the paths already
    # rewritten in the HTML by the sub_filter block below.
    location /assets/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/assets/;
        proxy_read_timeout 60s;
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/fonts/;
        proxy_read_timeout 60s;
    }

    location /manifest.webmanifest {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/manifest.webmanifest;
    }

    location /favicon.ico {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/favicon.ico;
    }

    location /favicon.svg {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/favicon.svg;
    }

    # Frontend HTML — rewrite absolute paths to relative and inject our fix script.
    # This ONLY applies to text/html responses (the index.html SPA shell).
    location / {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;

        # Disable upstream compression so sub_filter can inspect the body.
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html;

        # Convert absolute paths to relative so the browser resolves them
        # from the current ingress URL (e.g. /api/hassio_ingress/TOKEN/).
        sub_filter 'src="/' 'src="./';
        sub_filter 'href="/' 'href="./';
        sub_filter "src='/" "src='./";
        sub_filter "href='/" "href='./";

        # Inject our fix script at the very start of <head>.
        # It must run before Vue.js boots to patch fetch/XHR/history.
        # Uses ./ so it resolves through the ingress prefix.
        sub_filter '<head>' '<head><script src="./ha-ingress-fix.js"></script>';
    }

    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
