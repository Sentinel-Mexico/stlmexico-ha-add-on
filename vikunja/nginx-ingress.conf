server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Disable upstream compression so sub_filter can inspect/rewrite HTML.
    proxy_set_header Accept-Encoding "";

    # Serve the ingress-fix script as a static file so we avoid putting
    # JavaScript (which contains $ and {}) inside the nginx config.
    location = /ha-ingress-fix.js {
        alias /etc/nginx/ha-ingress-fix.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        sub_filter_once off;
        sub_filter_types text/html;

        # Convert absolute asset paths in HTML attributes to relative
        # so they resolve through the HA ingress base path.
        sub_filter 'src="/' 'src="./';
        sub_filter 'href="/' 'href="./';
        sub_filter "src='/" "src='./";
        sub_filter "href='/" "href='./";

        # Inject a relative <base> and the fix script right before </head>.
        # "./" resolves against the document URL which already includes the
        # ingress prefix, so all relative asset loads go through ingress.
        sub_filter '</head>' '<base href="./"><script src="./ha-ingress-fix.js"></script></head>';
    }

    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
