server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Disable upstream compression so sub_filter can inspect/rewrite.
    proxy_set_header Accept-Encoding "";

    # Serve the ingress-fix script as a static file.
    location = /ha-ingress-fix.js {
        alias /etc/nginx/ha-ingress-fix.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    # API, WebSocket, DAV — proxy with no body rewriting.
    location /api/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /dav/ {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%/dav/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Frontend — rewrite HTML so asset paths are relative.
    location / {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;

        sub_filter_once off;
        sub_filter_types text/html;

        # Convert absolute asset paths to relative so they resolve
        # through the ingress base path the browser sees.
        sub_filter 'src="/' 'src="./';
        sub_filter 'href="/' 'href="./';
        sub_filter "src='/" "src='./";
        sub_filter "href='/" "href='./";

        # Inject our fix script as the very first thing in <head>.
        # It must run before ANY other script (including module scripts)
        # so that fetch/XHR patches are in place for Vikunja's init.
        sub_filter '<head>' '<head><script src="./ha-ingress-fix.js"></script>';
    }

    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
